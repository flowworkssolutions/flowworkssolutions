<style>/* ─────────────────────────────────────────────────────────────────
   FlowWorks landing page — premium styles
   Brand: teal #15B5A8 · ink #0E2E2C · bg #F4F6F7 · green #2DC084
   ───────────────────────────────────────────────────────────────── */

:root {
  --teal: #15B5A8;
  --teal-dk: #0F8F85;
  --teal-lt: #7FDDD3;
  --ink: #0E2E2C;
  --ink-2: #1F3D3A;
  --bg: #F4F6F7;
  --card: #FFFFFF;
  --green: #2DC084;
  --amber: #F4B43A;
  --red: #E26054;
  --text: #0E2E2C;
  --muted: #6B7B79;
  --muted-2: #9AA8A6;
  --border: #E3E8E7;
  --border-strong: #C9D3D1;

  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --maxw: 1280px;
  --gutter: clamp(20px, 4vw, 56px);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --shadow-sm: 0 2px 8px rgba(14,46,44,0.06), 0 1px 2px rgba(14,46,44,0.04);
  --shadow-md: 0 10px 32px rgba(14,46,44,0.08), 0 2px 8px rgba(14,46,44,0.04);
  --shadow-lg: 0 30px 80px rgba(14,46,44,0.18), 0 8px 24px rgba(14,46,44,0.10);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body { overflow-x: hidden; }

img, svg, iframe { display: block; max-width: 100%; }

a { color: inherit; text-decoration: none; }

/* ── Type ───────────────────────────────────────────────────────── */

.kicker {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.3em;
  font-weight: 600;
  color: var(--teal);
  text-transform: uppercase;
  display: inline-block;
}

.display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 0.98;
  color: var(--ink);
}

.display-xl  { font-size: clamp(48px, 7.2vw, 104px); }
.display-lg  { font-size: clamp(40px, 5.4vw, 80px); }
.display-md  { font-size: clamp(32px, 3.6vw, 56px); }
.display-sm  { font-size: clamp(24px, 2.4vw, 36px); }

.display .teal { color: var(--teal); }

.lead {
  font-family: var(--font-ui);
  font-size: clamp(16px, 1.3vw, 20px);
  line-height: 1.55;
  color: var(--muted);
  max-width: 60ch;
}

.eyebrow-rule {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.eyebrow-rule::before {
  content: "";
  width: 28px;
  height: 1px;
  background: var(--teal);
  display: block;
}

/* ── Layout ─────────────────────────────────────────────────────── */

.section {
  position: relative;
  padding: clamp(80px, 10vw, 140px) var(--gutter);
}
.section--tight { padding: clamp(60px, 7vw, 96px) var(--gutter); }
.section--dark {
  background: var(--ink);
  color: #fff;
}
.section--dark .display { color: #fff; }
.section--dark .lead { color: #9ec3bf; }

.container {
  max-width: var(--maxw);
  margin: 0 auto;
  width: 100%;
}

/* ── Grid background (matches trailer) ─────────────────────────── */

.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(21,181,168,0.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,181,168,0.10) 1px, transparent 1px);
  background-size: 80px 80px;
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.grid-bg--dark {
  background-image:
    linear-gradient(rgba(21,181,168,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,181,168,0.07) 1px, transparent 1px);
}

/* ── Nav ────────────────────────────────────────────────────────── */

.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px var(--gutter);
  transition: backdrop-filter 200ms, background 200ms, padding 200ms, border-color 200ms, color 200ms;
  border-bottom: 1px solid transparent;
  /* Default (light-hero) top state */
  background: rgba(244,246,247,0.55);
  backdrop-filter: saturate(160%) blur(10px);
  -webkit-backdrop-filter: saturate(160%) blur(10px);
}

.nav--scrolled {
  background: rgba(255,255,255,0.86);
  backdrop-filter: saturate(180%) blur(18px);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-bottom-color: var(--border);
  padding-top: 12px;
  padding-bottom: 12px;
}

/* Over a dark hero (theatre / full-bleed), nav uses a dark frosted
   surface and light text so the brand stays readable. */
body[data-hero="theatre"] .nav:not(.nav--scrolled),
body[data-hero="full"]    .nav:not(.nav--scrolled) {
  background: linear-gradient(180deg, rgba(6,32,30,0.62), rgba(6,32,30,0.0));
  backdrop-filter: saturate(160%) blur(8px);
  -webkit-backdrop-filter: saturate(160%) blur(8px);
}
body[data-hero="theatre"] .nav:not(.nav--scrolled) .nav__logo,
body[data-hero="full"]    .nav:not(.nav--scrolled) .nav__logo {
  color: #fff;
}
body[data-hero="theatre"] .nav:not(.nav--scrolled) .nav__link,
body[data-hero="full"]    .nav:not(.nav--scrolled) .nav__link {
  color: #fff;
  opacity: 0.92;
}
body[data-hero="theatre"] .nav:not(.nav--scrolled) .nav__link:hover,
body[data-hero="full"]    .nav:not(.nav--scrolled) .nav__link:hover {
  color: var(--teal-lt);
  opacity: 1;
}
.nav__logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.nav__logo img { width: 26px; height: auto; }
.nav__links {
  display: flex;
  align-items: center;
  gap: 36px;
}
.nav__link {
  font-family: var(--font-ui);
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  opacity: 0.78;
  transition: opacity 160ms, color 160ms;
  position: relative;
}
.nav__link:hover { opacity: 1; color: var(--teal); }
.nav__cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

@media (max-width: 820px) {
  .nav__links { display: none; }
}

/* ── Buttons ────────────────────────────────────────────────────── */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 13px 22px;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: -0.005em;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 140ms, box-shadow 200ms, background 200ms, color 200ms, border-color 200ms;
  white-space: nowrap;
  text-decoration: none;
}
.btn:active { transform: translateY(1px); }

.btn--primary {
  background: var(--teal);
  color: #fff;
  box-shadow: 0 6px 20px rgba(21,181,168,0.28), 0 1px 0 rgba(255,255,255,0.18) inset;
}
.btn--primary:hover {
  background: var(--teal-dk);
  box-shadow: 0 10px 28px rgba(21,181,168,0.36), 0 1px 0 rgba(255,255,255,0.18) inset;
}
.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--border-strong);
}
.btn--ghost:hover { border-color: var(--ink); }
.btn--ghost-dark {
  background: rgba(255,255,255,0.06);
  color: #fff;
  border-color: rgba(255,255,255,0.18);
}
.btn--ghost-dark:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.btn--lg { padding: 16px 26px; font-size: 15px; border-radius: 12px; }
.btn .arr { transition: transform 200ms; }
.btn:hover .arr { transform: translateX(3px); }

/* ── Hero ───────────────────────────────────────────────────────── */

.hero {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

/* Theatre variant — dark cinematic block */
.hero--theatre {
  background: linear-gradient(180deg, #06201E 0%, var(--ink) 60%, #0a2624 100%);
  color: #fff;
  padding: clamp(120px, 14vw, 200px) var(--gutter) clamp(80px, 9vw, 120px);
  text-align: center;
}
.hero--theatre .display { color: #fff; }
.hero--theatre .lead { color: #9ec3bf; }
.hero--theatre .kicker { color: var(--teal-lt); }

.hero__inner {
  position: relative;
  z-index: 2;
  max-width: var(--maxw);
  margin: 0 auto;
}
.hero__kicker { margin-bottom: 28px; }
.hero__title { margin: 0 auto; max-width: 18ch; }
.hero__sub {
  margin: 28px auto 0;
  text-align: center;
}
.hero__ctas {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 36px;
  flex-wrap: wrap;
}

/* Video stage — shared frame */
.video-stage {
  position: relative;
  margin: clamp(48px, 6vw, 80px) auto 0;
  max-width: 1140px;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow:
    0 60px 120px rgba(0,0,0,0.45),
    0 30px 60px rgba(0,0,0,0.30),
    0 0 0 1px rgba(255,255,255,0.06);
  background: #0a0a0a;
  transform: translateZ(0);
}
.video-stage iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-stage__glow {
  position: absolute;
  inset: -40% -20%;
  background: radial-gradient(ellipse at center, rgba(21,181,168,0.22), transparent 60%);
  filter: blur(40px);
  z-index: -1;
  pointer-events: none;
}

/* ── Sleek video frame (premium, integrated, no browser chrome) ── */

.video-sleek {
  position: relative;
  margin: clamp(48px, 6vw, 80px) auto 0;
  max-width: 1140px;
  width: 100%;
}
.video-sleek__glow {
  position: absolute;
  inset: -10% -8%;
  background: radial-gradient(ellipse at 50% 60%, rgba(21,181,168,0.30), transparent 65%);
  filter: blur(60px);
  z-index: 0;
  pointer-events: none;
}
.video-sleek__frame {
  position: relative;
  z-index: 1;
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  background: #0a0a0a;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.20),
    0 40px 80px rgba(0,0,0,0.55),
    0 16px 32px rgba(0,0,0,0.30);
}
.video-sleek__frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
/* On a light hero, soften the frame border + shadow */
body[data-hero="split"] .video-sleek__frame,
body[data-hero="editorial"] .video-sleek__frame {
  border-color: var(--border);
  box-shadow:
    0 0 0 1px rgba(14,46,44,0.04),
    0 30px 60px rgba(14,46,44,0.18),
    0 12px 24px rgba(14,46,44,0.10);
}
body[data-hero="split"] .video-sleek__glow,
body[data-hero="editorial"] .video-sleek__glow {
  background: radial-gradient(ellipse at 50% 60%, rgba(21,181,168,0.18), transparent 65%);
}

.video-chrome {
  position: relative;
  margin: clamp(48px, 6vw, 80px) auto 0;
  max-width: 1140px;
  background: #fff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.video-chrome__bar {
  height: 40px;
  background: #fafbfb;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
}
.video-chrome__bar .dot { width: 11px; height: 11px; border-radius: 50%; }
.video-chrome__bar .dot--r { background: #FE5F57; }
.video-chrome__bar .dot--y { background: #FEBC2D; }
.video-chrome__bar .dot--g { background: #27C940; }
.video-chrome__bar .addr {
  margin-left: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  background: #fff;
  padding: 4px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.video-chrome__body {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #0a0a0a;
}
.video-chrome__body iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
}

/* ── Video poster (lazy-load trailer) ──────────────────────────── */

.video-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  margin: 0;
  padding: 0;
  cursor: pointer;
  background: linear-gradient(135deg, #06201E 0%, var(--ink) 50%, #08312D 100%);
  color: #fff;
  overflow: hidden;
  display: block;
}
.video-poster__bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 40%, rgba(21,181,168,0.30), transparent 60%);
}
.video-poster__grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(127,221,211,0.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,221,211,0.10) 1px, transparent 1px);
  background-size: 60px 60px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 0%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 50%, black 0%, transparent 75%);
  opacity: 0.7;
}
.video-poster__mark {
  position: absolute;
  top: 50%; left: 50%;
  width: 110px; height: auto;
  transform: translate(-50%, -50%);
  opacity: 0.14;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.4));
  transition: opacity 220ms, transform 220ms cubic-bezier(.2,.7,.2,1);
}
.video-poster:hover .video-poster__mark {
  opacity: 0.20;
  transform: translate(-50%, -50%) scale(1.05);
}
.video-poster__overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 2;
}
.video-poster__meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}
.video-poster__kicker {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.36em;
  color: var(--teal-lt);
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.video-poster__title {
  font-family: var(--font-display);
  font-size: clamp(20px, 2.4vw, 32px);
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.02em;
}
.video-poster__dur {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #9ec3bf;
  margin-top: 6px;
}

.play-btn {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 8px rgba(255,255,255,0.06),
    0 0 0 16px rgba(255,255,255,0.03),
    0 20px 40px rgba(21,181,168,0.45);
  transition: transform 200ms cubic-bezier(.2,.7,.2,1), background 200ms;
  position: relative;
}
.play-btn svg { transform: translateX(2px); }
.play-btn::before {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 2px solid rgba(127,221,211,0.3);
  animation: playPulse 2.4s ease-out infinite;
}
.video-poster:hover .play-btn {
  transform: scale(1.06);
  background: var(--teal-dk);
}
@keyframes playPulse {
  0%   { transform: scale(0.95); opacity: 0.6; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Full-bleed hero poster */
.hero--full__poster {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(21,181,168,0.25), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(45,192,132,0.12), transparent 60%),
    linear-gradient(135deg, #06201E 0%, var(--ink) 50%, #08312D 100%);
}
.hero--full__poster-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(127,221,211,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,221,211,0.08) 1px, transparent 1px);
  background-size: 80px 80px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 75%);
}

/* Split variant — text left, video right */
.hero--split {
  padding: clamp(140px, 16vw, 200px) var(--gutter) clamp(80px, 9vw, 120px);
  background: var(--bg);
}
.hero--split .hero__inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: clamp(40px, 6vw, 88px);
  align-items: center;
  text-align: left;
}
.hero--split .hero__title { margin: 0; max-width: none; }
.hero--split .hero__sub { margin: 28px 0 0; text-align: left; }
.hero--split .hero__ctas { justify-content: flex-start; }
.hero--split .video-chrome { margin: 0; }
@media (max-width: 900px) {
  .hero--split .hero__inner { grid-template-columns: 1fr; }
}

/* Full-bleed variant */
.hero--full {
  background: #000;
  height: 100vh;
  min-height: 640px;
  padding: 0;
  color: #fff;
}
.hero--full .display { color: #fff; }
.hero--full .lead { color: #cfdcd9; }
.hero--full .kicker { color: var(--teal-lt); }
.hero--full__video {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero--full__video iframe { width: 100%; height: 100%; border: 0; }
.hero--full__veil {
  position: absolute; inset: 0; z-index: 1;
