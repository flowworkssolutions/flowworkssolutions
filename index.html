<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowWorks — Logistics, in flow</title>
<meta name="description" content="Reimagine your logistics with FlowWorks — one custom portal that connects people, processes, and data. Tracking, AI document analysis, CO₂ monitoring, and BI in one tailor-made platform.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>/* ─────────────────────────────────────────────────────────────────
   FlowWorks landing page — premium styles
   Brand: teal #15B5A8 · ink #0E2E2C · bg #F4F6F7 · green #2DC084
   ───────────────────────────────────────────────────────────────── */

:root {
  --teal: #15B5A8;
  --teal-dk: #0F8F85;
  --teal-lt: #7FDDD3;
  --ink: #0E2E2C;
  --ink-2: #1F3D3A;
  --bg: #F4F6F7;
  --card: #FFFFFF;
  --green: #2DC084;
  --amber: #F4B43A;
  --red: #E26054;
  --text: #0E2E2C;
  --muted: #6B7B79;
  --muted-2: #9AA8A6;
  --border: #E3E8E7;
  --border-strong: #C9D3D1;

  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-ui: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --maxw: 1280px;
  --gutter: clamp(20px, 4vw, 56px);
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --shadow-sm: 0 2px 8px rgba(14,46,44,0.06), 0 1px 2px rgba(14,46,44,0.04);
  --shadow-md: 0 10px 32px rgba(14,46,44,0.08), 0 2px 8px rgba(14,46,44,0.04);
  --shadow-lg: 0 30px 80px rgba(14,46,44,0.18), 0 8px 24px rgba(14,46,44,0.10);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body { overflow-x: hidden; }

img, svg, iframe { display: block; max-width: 100%; }

a { color: inherit; text-decoration: none; }

/* ── Type ───────────────────────────────────────────────────────── */

.kicker {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.3em;
  font-weight: 600;
  color: var(--teal);
  text-transform: uppercase;
  display: inline-block;
}

.display {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 0.98;
  color: var(--ink);
}

.display-xl  { font-size: clamp(48px, 7.2vw, 104px); }
.display-lg  { font-size: clamp(40px, 5.4vw, 80px); }
.display-md  { font-size: clamp(32px, 3.6vw, 56px); }
.display-sm  { font-size: clamp(24px, 2.4vw, 36px); }

.display .teal { color: var(--teal); }

.lead {
  font-family: var(--font-ui);
  font-size: clamp(16px, 1.3vw, 20px);
  line-height: 1.55;
  color: var(--muted);
  max-width: 60ch;
}

.eyebrow-rule {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.eyebrow-rule::before {
  content: "";
  width: 28px;
  height: 1px;
  background: var(--teal);
  display: block;
}

/* ── Layout ─────────────────────────────────────────────────────── */

.section {
  position: relative;
  padding: clamp(80px, 10vw, 140px) var(--gutter);
}
.section--tight { padding: clamp(60px, 7vw, 96px) var(--gutter); }
.section--dark {
  background: var(--ink);
  color: #fff;
}
.section--dark .display { color: #fff; }
.section--dark .lead { color: #9ec3bf; }

.container {
  max-width: var(--maxw);
  margin: 0 auto;
  width: 100%;
}

/* ── Grid background (matches trailer) ─────────────────────────── */

.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(21,181,168,0.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,181,168,0.10) 1px, transparent 1px);
  background-size: 80px 80px;
  -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.grid-bg--dark {
  background-image:
    linear-gradient(rgba(21,181,168,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(21,181,168,0.07) 1px, transparent 1px);
}

/* ── Nav ────────────────────────────────────────────────────────── */

.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px var(--gutter);
  transition: backdrop-filter 200ms, background 200ms, padding 200ms, border-color 200ms, color 200ms;
  border-bottom: 1px solid transparent;
  /* Default (light-hero) top state */
  background: rgba(244,246,247,0.55);
  backdrop-filter: saturate(160%) blur(10px);
  -webkit-backdrop-filter: saturate(160%) blur(10px);
}

.nav--scrolled {
  background: rgba(255,255,255,0.86);
  backdrop-filter: saturate(180%) blur(18px);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-bottom-color: var(--border);
  padding-top: 12px;
  padding-bottom: 12px;
}

/* Over a dark hero (theatre / full-bleed), nav uses a dark frosted
   surface and light text so the brand stays readable. */
body[data-hero="theatre"] .nav:not(.nav--scrolled),
body[data-hero="full"]    .nav:not(.nav--scrolled) {
  background: linear-gradient(180deg, rgba(6,32,30,0.62), rgba(6,32,30,0.0));
  backdrop-filter: saturate(160%) blur(8px);
  -webkit-backdrop-filter: saturate(160%) blur(8px);
}
body[data-hero="theatre"] .nav:not(.nav--scrolled) .nav__logo,
body[data-hero="full"]    .nav:not(.nav--scrolled) .nav__logo {
  color: #fff;
}
body[data-hero="theatre"] .nav:not(.nav--scrolled) .nav__link,
body[data-hero="full"]    .nav:not(.nav--scrolled) .nav__link {
  color: #fff;
  opacity: 0.92;
}
body[data-hero="theatre"] .nav:not(.nav--scrolled) .nav__link:hover,
body[data-hero="full"]    .nav:not(.nav--scrolled) .nav__link:hover {
  color: var(--teal-lt);
  opacity: 1;
}
.nav__logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.nav__logo img { width: 26px; height: auto; }
.nav__links {
  display: flex;
  align-items: center;
  gap: 36px;
}
.nav__link {
  font-family: var(--font-ui);
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  opacity: 0.78;
  transition: opacity 160ms, color 160ms;
  position: relative;
}
.nav__link:hover { opacity: 1; color: var(--teal); }
.nav__cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

@media (max-width: 820px) {
  .nav__links { display: none; }
}

/* ── Buttons ────────────────────────────────────────────────────── */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 13px 22px;
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: -0.005em;
  border-radius: 10px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform 140ms, box-shadow 200ms, background 200ms, color 200ms, border-color 200ms;
  white-space: nowrap;
  text-decoration: none;
}
.btn:active { transform: translateY(1px); }

.btn--primary {
  background: var(--teal);
  color: #fff;
  box-shadow: 0 6px 20px rgba(21,181,168,0.28), 0 1px 0 rgba(255,255,255,0.18) inset;
}
.btn--primary:hover {
  background: var(--teal-dk);
  box-shadow: 0 10px 28px rgba(21,181,168,0.36), 0 1px 0 rgba(255,255,255,0.18) inset;
}
.btn--ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--border-strong);
}
.btn--ghost:hover { border-color: var(--ink); }
.btn--ghost-dark {
  background: rgba(255,255,255,0.06);
  color: #fff;
  border-color: rgba(255,255,255,0.18);
}
.btn--ghost-dark:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.btn--lg { padding: 16px 26px; font-size: 15px; border-radius: 12px; }
.btn .arr { transition: transform 200ms; }
.btn:hover .arr { transform: translateX(3px); }

/* ── Hero ───────────────────────────────────────────────────────── */

.hero {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

/* Theatre variant — dark cinematic block */
.hero--theatre {
  background: linear-gradient(180deg, #06201E 0%, var(--ink) 60%, #0a2624 100%);
  color: #fff;
  padding: clamp(120px, 14vw, 200px) var(--gutter) clamp(80px, 9vw, 120px);
  text-align: center;
}
.hero--theatre .display { color: #fff; }
.hero--theatre .lead { color: #9ec3bf; }
.hero--theatre .kicker { color: var(--teal-lt); }

.hero__inner {
  position: relative;
  z-index: 2;
  max-width: var(--maxw);
  margin: 0 auto;
}
.hero__kicker { margin-bottom: 28px; }
.hero__title { margin: 0 auto; max-width: 18ch; }
.hero__sub {
  margin: 28px auto 0;
  text-align: center;
}
.hero__ctas {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 36px;
  flex-wrap: wrap;
}

/* Video stage — shared frame */
.video-stage {
  position: relative;
  margin: clamp(48px, 6vw, 80px) auto 0;
  max-width: 1140px;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow:
    0 60px 120px rgba(0,0,0,0.45),
    0 30px 60px rgba(0,0,0,0.30),
    0 0 0 1px rgba(255,255,255,0.06);
  background: #0a0a0a;
  transform: translateZ(0);
}
.video-stage iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-stage__glow {
  position: absolute;
  inset: -40% -20%;
  background: radial-gradient(ellipse at center, rgba(21,181,168,0.22), transparent 60%);
  filter: blur(40px);
  z-index: -1;
  pointer-events: none;
}

/* ── Sleek video frame (premium, integrated, no browser chrome) ── */

.video-sleek {
  position: relative;
  margin: clamp(48px, 6vw, 80px) auto 0;
  max-width: 1140px;
  width: 100%;
}
.video-sleek__glow {
  position: absolute;
  inset: -10% -8%;
  background: radial-gradient(ellipse at 50% 60%, rgba(21,181,168,0.30), transparent 65%);
  filter: blur(60px);
  z-index: 0;
  pointer-events: none;
}
.video-sleek__frame {
  position: relative;
  z-index: 1;
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  background: #0a0a0a;
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.20),
    0 40px 80px rgba(0,0,0,0.55),
    0 16px 32px rgba(0,0,0,0.30);
}
.video-sleek__frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
/* On a light hero, soften the frame border + shadow */
body[data-hero="split"] .video-sleek__frame,
body[data-hero="editorial"] .video-sleek__frame {
  border-color: var(--border);
  box-shadow:
    0 0 0 1px rgba(14,46,44,0.04),
    0 30px 60px rgba(14,46,44,0.18),
    0 12px 24px rgba(14,46,44,0.10);
}
body[data-hero="split"] .video-sleek__glow,
body[data-hero="editorial"] .video-sleek__glow {
  background: radial-gradient(ellipse at 50% 60%, rgba(21,181,168,0.18), transparent 65%);
}

.video-chrome {
  position: relative;
  margin: clamp(48px, 6vw, 80px) auto 0;
  max-width: 1140px;
  background: #fff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.video-chrome__bar {
  height: 40px;
  background: #fafbfb;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
}
.video-chrome__bar .dot { width: 11px; height: 11px; border-radius: 50%; }
.video-chrome__bar .dot--r { background: #FE5F57; }
.video-chrome__bar .dot--y { background: #FEBC2D; }
.video-chrome__bar .dot--g { background: #27C940; }
.video-chrome__bar .addr {
  margin-left: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  background: #fff;
  padding: 4px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
}
.video-chrome__body {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #0a0a0a;
}
.video-chrome__body iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
}

/* ── Video poster (lazy-load trailer) ──────────────────────────── */

.video-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  margin: 0;
  padding: 0;
  cursor: pointer;
  background: linear-gradient(135deg, #06201E 0%, var(--ink) 50%, #08312D 100%);
  color: #fff;
  overflow: hidden;
  display: block;
}
.video-poster__bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 40%, rgba(21,181,168,0.30), transparent 60%);
}
.video-poster__grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(127,221,211,0.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,221,211,0.10) 1px, transparent 1px);
  background-size: 60px 60px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 0%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 50%, black 0%, transparent 75%);
  opacity: 0.7;
}
.video-poster__mark {
  position: absolute;
  top: 50%; left: 50%;
  width: 110px; height: auto;
  transform: translate(-50%, -50%);
  opacity: 0.14;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.4));
  transition: opacity 220ms, transform 220ms cubic-bezier(.2,.7,.2,1);
}
.video-poster:hover .video-poster__mark {
  opacity: 0.20;
  transform: translate(-50%, -50%) scale(1.05);
}
.video-poster__overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 2;
}
.video-poster__meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}
.video-poster__kicker {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.36em;
  color: var(--teal-lt);
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.video-poster__title {
  font-family: var(--font-display);
  font-size: clamp(20px, 2.4vw, 32px);
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.02em;
}
.video-poster__dur {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  color: #9ec3bf;
  margin-top: 6px;
}

.play-btn {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 8px rgba(255,255,255,0.06),
    0 0 0 16px rgba(255,255,255,0.03),
    0 20px 40px rgba(21,181,168,0.45);
  transition: transform 200ms cubic-bezier(.2,.7,.2,1), background 200ms;
  position: relative;
}
.play-btn svg { transform: translateX(2px); }
.play-btn::before {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  border: 2px solid rgba(127,221,211,0.3);
  animation: playPulse 2.4s ease-out infinite;
}
.video-poster:hover .play-btn {
  transform: scale(1.06);
  background: var(--teal-dk);
}
@keyframes playPulse {
  0%   { transform: scale(0.95); opacity: 0.6; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Full-bleed hero poster */
.hero--full__poster {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(21,181,168,0.25), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(45,192,132,0.12), transparent 60%),
    linear-gradient(135deg, #06201E 0%, var(--ink) 50%, #08312D 100%);
}
.hero--full__poster-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(127,221,211,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,221,211,0.08) 1px, transparent 1px);
  background-size: 80px 80px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 75%);
}

/* Split variant — text left, video right */
.hero--split {
  padding: clamp(140px, 16vw, 200px) var(--gutter) clamp(80px, 9vw, 120px);
  background: var(--bg);
}
.hero--split .hero__inner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: clamp(40px, 6vw, 88px);
  align-items: center;
  text-align: left;
}
.hero--split .hero__title { margin: 0; max-width: none; }
.hero--split .hero__sub { margin: 28px 0 0; text-align: left; }
.hero--split .hero__ctas { justify-content: flex-start; }
.hero--split .video-chrome { margin: 0; }
@media (max-width: 900px) {
  .hero--split .hero__inner { grid-template-columns: 1fr; }
}

/* Full-bleed variant */
.hero--full {
  background: #000;
  height: 100vh;
  min-height: 640px;
  padding: 0;
  color: #fff;
}
.hero--full .display { color: #fff; }
.hero--full .lead { color: #cfdcd9; }
.hero--full .kicker { color: var(--teal-lt); }
.hero--full__video {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero--full__video iframe { width: 100%; height: 100%; border: 0; }
.hero--full__veil {
  position: absolute; inset: 0; z-index: 1;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.20) 30%, rgba(0,0,0,0.20) 70%, rgba(0,0,0,0.75) 100%),
    linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.0) 50%);
  pointer-events: none;
}
.hero--full .hero__inner {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: var(--gutter);
  padding-bottom: clamp(60px, 7vw, 100px);
  text-align: left;
  max-width: var(--maxw);
}
.hero--full .hero__title { margin: 0; max-width: 16ch; }
.hero--full .hero__sub { margin-top: 24px; text-align: left; }
.hero--full .hero__ctas { justify-content: flex-start; }

/* Editorial variant — centered video, corner kickers */
.hero--editorial {
  background: var(--bg);
  padding: clamp(140px, 16vw, 200px) var(--gutter) clamp(80px, 9vw, 120px);
  text-align: center;
}
.hero--editorial .hero__corners {
  position: absolute;
  inset: 100px var(--gutter) 60px;
  pointer-events: none;
  z-index: 1;
}
.hero--editorial .corner {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.24em;
  color: var(--muted);
  text-transform: uppercase;
}
.hero--editorial .corner--tl { top: 0; left: 0; }
.hero--editorial .corner--tr { top: 0; right: 0; text-align: right; }
.hero--editorial .corner--bl { bottom: 0; left: 0; }
.hero--editorial .corner--br { bottom: 0; right: 0; text-align: right; }

/* Scroll cue */
.scroll-cue {
  margin-top: clamp(40px, 5vw, 60px);
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--muted-2);
  text-transform: uppercase;
}
.scroll-cue .bar {
  width: 1px;
  height: 32px;
  background: linear-gradient(180deg, transparent, var(--teal));
  animation: scrollPulse 2.2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%, 100% { opacity: 0.3; transform: scaleY(0.7); }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ── Demo form ─────────────────────────────────────────────────── */

.demo-section {
  background: #fff;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.demo-grid {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: clamp(40px, 6vw, 96px);
  align-items: start;
}
@media (max-width: 900px) {
  .demo-grid { grid-template-columns: 1fr; }
}
.demo-grid__pitch h2 { margin: 16px 0 0; }
.demo-grid__pitch .lead { margin-top: 24px; }
.demo-bullets {
  list-style: none;
  padding: 0;
  margin: 32px 0 0;
  display: grid;
  gap: 16px;
}
.demo-bullets li {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  font-size: 15px;
  color: var(--ink);
}
.demo-bullets .tick {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(45,192,132,0.12);
  color: var(--green);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  margin-top: 1px;
}

.form {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(28px, 3.5vw, 44px);
  box-shadow: var(--shadow-sm);
}
.form__row {
  display: grid;
  gap: 18px;
}
.form__row--2 {
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 560px) { .form__row--2 { grid-template-columns: 1fr; } }

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}
.field label {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.field input,
.field textarea {
  font-family: var(--font-ui);
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 14px 16px;
  outline: none;
  transition: border-color 160ms, box-shadow 160ms;
  width: 100%;
}
.field input:focus,
.field textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 4px rgba(21,181,168,0.14);
}
.field textarea { min-height: 120px; resize: vertical; font-family: var(--font-ui); }
.field .req { color: var(--teal); }

.form__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 10px;
}
.form__hint {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
}
.form__success {
  margin-top: 16px;
  padding: 16px 18px;
  background: rgba(45,192,132,0.08);
  border: 1px solid rgba(45,192,132,0.30);
  border-radius: 10px;
  color: var(--ink);
  font-size: 14px;
  display: flex; gap: 12px; align-items: center;
}

/* ── Features ──────────────────────────────────────────────────── */

.features-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(24px, 5vw, 80px);
  align-items: end;
  margin-bottom: clamp(48px, 6vw, 80px);
}
.features-head .lead { margin-top: 0; }
@media (max-width: 820px) { .features-head { grid-template-columns: 1fr; } }

.features {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
@media (max-width: 900px) { .features { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .features { grid-template-columns: 1fr; } }

.feature {
  position: relative;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 32px 28px 36px;
  transition: transform 220ms cubic-bezier(.2,.7,.2,1), box-shadow 220ms, border-color 220ms;
  overflow: hidden;
}
.feature::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at top right, rgba(21,181,168,0.10), transparent 60%);
  opacity: 0;
  transition: opacity 280ms;
  pointer-events: none;
}
.feature:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: rgba(21,181,168,0.4);
}
.feature:hover::before { opacity: 1; }
.feature__icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--teal), var(--teal-dk));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(21,181,168,0.30);
  margin-bottom: 22px;
}
.feature__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0 0 10px;
}
.feature__desc {
  font-size: 15px;
  line-height: 1.55;
  color: var(--muted);
  margin: 0;
}
.feature__tag {
  position: absolute;
  top: 28px; right: 24px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--muted-2);
  text-transform: uppercase;
}

/* ── Portfolio ─────────────────────────────────────────────────── */

/* Platform features — dark variant */
.platform-dark {
  background: var(--ink);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.platform-dark .display { color: #fff; }
.platform-dark .lead { color: #9ec3bf; }
.platform-dark .kicker { color: var(--teal-lt); }

.feature--dark {
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.10);
  backdrop-filter: blur(4px);
}
.feature--dark::before {
  background: radial-gradient(ellipse at top right, rgba(21,181,168,0.18), transparent 60%);
}
.feature--dark:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(127,221,211,0.45);
  box-shadow: 0 12px 32px rgba(0,0,0,0.30);
}
.feature--dark .feature__title { color: #fff; }
.feature--dark .feature__desc { color: #9ec3bf; }
.feature--dark .feature__tag { color: rgba(255,255,255,0.42); }
.feature--dark .feature__icon {
  box-shadow: 0 8px 20px rgba(21,181,168,0.40);
}

.portfolio {
  background: var(--ink);
  color: #fff;
}
.portfolio .display { color: #fff; }
.portfolio .lead { color: #9ec3bf; }
.portfolio .kicker { color: var(--teal-lt); }

.cases {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin-top: clamp(48px, 6vw, 80px);
}
@media (max-width: 900px) { .cases { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .cases { grid-template-columns: 1fr; } }

.case {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--radius-md);
  overflow: hidden;
  transition: transform 220ms cubic-bezier(.2,.7,.2,1), border-color 220ms, background 220ms;
}
.case:hover {
  transform: translateY(-4px);
  border-color: rgba(127,221,211,0.45);
  background: rgba(255,255,255,0.06);
}
.case__media {
  position: relative;
  aspect-ratio: 4 / 3;
  background:
    repeating-linear-gradient(45deg,
      rgba(127,221,211,0.06) 0,
      rgba(127,221,211,0.06) 12px,
      rgba(127,221,211,0.02) 12px,
      rgba(127,221,211,0.02) 24px),
    linear-gradient(135deg, rgba(21,181,168,0.10), rgba(21,181,168,0.02));
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.42);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.case__media span {
  padding: 6px 14px;
  border: 1px dashed rgba(127,221,211,0.30);
  border-radius: 999px;
}
.case__body { padding: 26px 26px 30px; }
.case__tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--teal-lt);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.case__title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #fff;
  margin: 0 0 10px;
}
.case__desc {
  font-size: 14.5px;
  line-height: 1.55;
  color: #9ec3bf;
  margin: 0 0 20px;
}
.case__metrics {
  display: flex;
  gap: 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 18px;
}
.case__metric {
  display: flex;
  flex-direction: column;
}
.case__metric .v {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
}
.case__metric .l {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.18em;
  color: var(--muted-2);
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── Founders ──────────────────────────────────────────────────── */

.founders {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: clamp(48px, 6vw, 80px);
}
@media (max-width: 820px) { .founders { grid-template-columns: 1fr; } }

.founder {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(28px, 3.5vw, 40px);
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 28px;
  align-items: start;
  transition: transform 220ms cubic-bezier(.2,.7,.2,1), box-shadow 220ms, border-color 220ms;
}
.founder:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: rgba(21,181,168,0.4);
}
@media (max-width: 560px) {
  .founder { grid-template-columns: 1fr; }
  .founder__photo { width: 100px; }
}
.founder__photo {
  width: 160px;
  aspect-ratio: 1;
  border-radius: 16px;
  background:
    repeating-linear-gradient(45deg,
      rgba(21,181,168,0.10) 0,
      rgba(21,181,168,0.10) 8px,
      rgba(21,181,168,0.04) 8px,
      rgba(21,181,168,0.04) 16px),
    linear-gradient(135deg, rgba(21,181,168,0.10), rgba(21,181,168,0.02));
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-align: center;
  padding: 8px;
}
.founder__photo:has(img) {
  padding: 0;
  overflow: hidden;
  background: #0E2E2C;
  border-color: rgba(14,46,44,0.18);
}
.founder__photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  display: block;
  transform: scale(1.06);
  transition: transform 400ms cubic-bezier(.2,.7,.2,1);
}
.founder:hover .founder__photo img { transform: scale(1.1); }
.founder__name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
}
.founder__role {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--teal);
  margin: 8px 0 16px;
}
.founder__bio {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--muted);
  margin: 0 0 20px;
}
.founder__links {
  display: flex;
  gap: 10px;
}
.icon-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  transition: color 160ms, border-color 160ms, background 160ms;
}
.icon-link:hover {
  color: var(--teal);
  border-color: var(--teal);
  background: rgba(21,181,168,0.04);
}

/* ── Footer ────────────────────────────────────────────────────── */

.footer {
  background: var(--ink);
  color: #fff;
  padding: clamp(60px, 7vw, 100px) var(--gutter) 32px;
  position: relative;
  overflow: hidden;
}
.footer__grid {
  max-width: var(--maxw);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 48px;
  align-items: start;
}
@media (max-width: 820px) { .footer__grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
@media (max-width: 480px) { .footer__grid { grid-template-columns: 1fr; } }

.footer__brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.footer__brand img { width: 30px; height: auto; }
.footer__brand span {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.footer__tag {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--teal-lt);
  margin-bottom: 22px;
}
.footer__about {
  font-size: 14px;
  line-height: 1.6;
  color: #9ec3bf;
  max-width: 32ch;
}
.footer__col h4 {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--teal-lt);
  margin: 0 0 18px;
  font-weight: 600;
}
.footer__col ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.footer__col a {
  color: #cfdcd9;
  font-size: 14px;
  transition: color 160ms;
}
.footer__col a:hover { color: var(--teal); }
.footer__bottom {
  max-width: var(--maxw);
  margin: 60px auto 0;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.12em;
  color: var(--muted-2);
}
.footer__bottom a { color: var(--muted-2); }
.footer__bottom a:hover { color: var(--teal); }

/* ── Reveal animations ─────────────────────────────────────────── */

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 700ms cubic-bezier(.2,.7,.2,1), transform 700ms cubic-bezier(.2,.7,.2,1);
  will-change: opacity, transform;
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal--d1 { transition-delay: 60ms; }
.reveal--d2 { transition-delay: 140ms; }
.reveal--d3 { transition-delay: 220ms; }
.reveal--d4 { transition-delay: 300ms; }
.reveal--d5 { transition-delay: 380ms; }

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; }
  .scroll-cue .bar { animation: none; }
  html { scroll-behavior: auto; }
}

/* ── Misc ──────────────────────────────────────────────────────── */

.tape {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}
.tape__dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px rgba(45,192,132,0.18);
  animation: pulseDot 2.4s ease-in-out infinite;
}
@keyframes pulseDot {
  0%, 100% { box-shadow: 0 0 0 4px rgba(45,192,132,0.18); }
  50% { box-shadow: 0 0 0 9px rgba(45,192,132,0.04); }
}

<script>
// tweaks-panel.jsx
// Reusable Tweaks shell + form-control helpers.
//
// Owns the host protocol (listens for __activate_edit_mode / __deactivate_edit_mode,
// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
//     "primaryColor": "#D97757",
//     "palette": ["#D97757", "#29261b", "#f6f4ef"],
//     "fontSize": 16,
//     "density": "regular",
//     "dark": false
//   }/*EDITMODE-END*/;
//
//   function App() {
//     const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
//     return (
//       <div style={{ fontSize: t.fontSize, color: t.primaryColor }}>
//         Hello
//         <TweaksPanel>
//           <TweakSection label="Typography" />
//           <TweakSlider label="Font size" value={t.fontSize} min={10} max={32} unit="px"
//                        onChange={(v) => setTweak('fontSize', v)} />
//           <TweakRadio  label="Density" value={t.density}
//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        options={['#D97757', '#2A6FDB', '#1F8A5B', '#7A5AE0']}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakColor  label="Palette" value={t.palette}
//                        options={[['#D97757', '#29261b', '#f6f4ef'],
//                                  ['#475569', '#0f172a', '#f1f5f9']]}
//                        onChange={(v) => setTweak('palette', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />
//         </TweaksPanel>
//       </div>
//     );
//   }
//
// ─────────────────────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
